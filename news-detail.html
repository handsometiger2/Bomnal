  <script src="db.js"></script>
  <script>
    let currentPostId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      currentPostId = params.get('id');

      if (!currentPostId) {
        alert('존재하지 않는 게시글입니다.');
        window.location.href = 'news.html';
        return;
      }

      if (isAdmin()) {
        const adminActions = document.getElementById('admin-actions');
        adminActions.classList.remove('hidden');
        document.getElementById('btn-edit').onclick = () => {
          window.location.href = `news-write.html?id=${currentPostId}`;
        };
      }

      const post = await getPostById(currentPostId);
      if (!post) {
        document.getElementById('post-title').innerText = '게시글을 찾을 수 없습니다.';
        document.getElementById('post-content').innerText = '삭제되었거나 존재하지 않는 게시글입니다.';
        return;
      }

      document.title = `${post.title} - 봄날부동산`;
      document.getElementById('post-category').innerText = post.category || '소식';
      document.getElementById('post-title').innerText = post.title || '';
      document.getElementById('post-date').innerText = post.date || '';

      if (post.image) {
        const imgContainer = document.getElementById('post-image-container');
        const img = document.getElementById('post-image');
        if (imgContainer && img) {
          img.src = post.image;
          img.alt = post.title || '';
          imgContainer.classList.remove('hidden');
        }
      }

      document.getElementById('post-content').innerHTML = renderMarkdown(post.content || '');
    });

    async function handleDelete() {
      if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) return;
      try {
        await deletePost(currentPostId);
        alert('게시글이 삭제되었습니다.');
        window.location.href = 'news.html';
      } catch (e) {
        alert('삭제 실패: ' + e.message);
      }
    }
  </script>
