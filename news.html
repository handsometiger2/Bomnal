    ];

    let allPosts = [];
    let currentCategory = '전체';

    document.addEventListener('DOMContentLoaded', async () => {
      allPosts = await getPosts();
      renderPosts();
    });

    function filterCategory(cat) {
      currentCategory = cat;
      const btns = document.querySelectorAll('.cat-btn');
      btns.forEach(b => {
        if (b.innerText.trim() === cat) {
          b.className = "cat-btn bg-primary text-white px-4 py-2 rounded-full text-sm font-bold shadow-sm transition-all";
        } else {
          b.className = "cat-btn bg-surface-container text-text-secondary hover:bg-primary-fixed px-4 py-2 rounded-full text-sm font-bold transition-all";
        }
      });
      renderPosts();
    }

    function handleSearch() {
      renderPosts();
    }

    function renderPosts() {
      const newsList = document.getElementById('news-list');
      const emptyMsg = document.getElementById('empty-msg');
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      let filtered = allPosts;
      if (currentCategory !== '전체') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }
      if (query) {
        filtered = filtered.filter(p => 
          (p.title && p.title.toLowerCase().includes(query)) ||
          (p.content && p.content.toLowerCase().includes(query))
        );
      }

      if (filtered.length === 0) {
        newsList.innerHTML = '';
        emptyMsg.classList.remove('hidden');
        return;
      }

      emptyMsg.classList.add('hidden');
      newsList.innerHTML = filtered.map((post, idx) => {
        const thumbUrl = post.image || sampleThumbnails[idx % sampleThumbnails.length];
        return `
          <article onclick="location.href='news-detail.html?id=${post.id}'" class="group cursor-pointer relative bg-surface-white rounded-xl overflow-hidden border border-outline-variant/30 hover:border-primary hover:shadow-md transition-all">
            <div class="aspect-square w-full relative overflow-hidden bg-surface-container-high">
              <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out" src="${thumbUrl}" alt="${escapeHtml(post.title || '')}" />
              <span class="absolute top-2 left-2 bg-primary/90 text-white text-[11px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">${escapeHtml(post.category || '소식')}</span>
            </div>
            <div class="p-4 bg-surface-white">
              <h3 class="font-body-main text-body-main text-on-surface line-clamp-2 font-semibold mb-1 group-hover:text-primary transition-colors">
                ${escapeHtml(post.title || '')}
              </h3>
              <p class="font-caption text-caption text-text-muted text-xs">${escapeHtml(post.date || '')}</p>
            </div>
          </article>
        `;
      }).join('');
    }
  </script>
