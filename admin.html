  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (isAdmin()) {
        document.getElementById('dashboard-view').classList.remove('hidden');
        await loadTableData();
      } else {
        document.getElementById('login-view').classList.remove('hidden');
      }
    });

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const inputPass = document.getElementById('input-password').value;
      const errorDiv = document.getElementById('login-error');

      const config = await loadConfig();
      const expectedPass = config.admin_password || 'admin1234';

      if (inputPass === expectedPass) {
        sessionStorage.setItem('isAdmin', 'true');
        window.location.reload();
      } else {
        errorDiv.classList.remove('hidden');
        errorDiv.innerText = '비밀번호가 올바르지 않습니다.';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('isAdmin');
      window.location.reload();
    }

    async function loadTableData() {
      const tbody = document.getElementById('posts-table-body');
      const emptyDiv = document.getElementById('table-empty');

      const posts = await getPosts();
      if (!posts || posts.length === 0) {
        tbody.innerHTML = '';
        emptyDiv.classList.remove('hidden');
        return;
      }

      emptyDiv.classList.add('hidden');
      tbody.innerHTML = posts.map((post, idx) => `
        <tr class="hover:bg-surface/60 transition-colors">
          <td class="py-4 px-6 font-mono text-text-muted">${posts.length - idx}</td>
          <td class="py-4 px-6">
            <span class="bg-primary/10 text-primary px-2.5 py-1 rounded-full text-xs font-bold">${escapeHtml(post.category || '소식')}</span>
          </td>
          <td class="py-4 px-6 font-bold text-on-surface hover:text-primary cursor-pointer" onclick="location.href='news-detail.html?id=${post.id}'">
            ${escapeHtml(post.title || '')}
          </td>
          <td class="py-4 px-6 text-text-muted text-xs">${escapeHtml(post.date || '')}</td>
          <td class="py-4 px-6 text-center">
            <div class="flex justify-center gap-2">
              <a href="news-write.html?id=${post.id}" class="bg-surface-container hover:bg-primary-fixed text-primary px-3 py-1.5 rounded-lg text-xs font-bold transition-colors inline-flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">edit</span> 수정
              </a>
              <button onclick="confirmDeletePost('${post.id}')" class="bg-error-container text-error hover:bg-red-200 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors inline-flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">delete</span> 삭제
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function confirmDeletePost(id) {
      if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) return;
      try {
        await deletePost(id);
        await loadTableData();
      } catch (e) {
        alert('삭제 실패: ' + e.message);
      }
    }
  </script>
